name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  commit-lint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch enough history to lint all commits in the PR
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Extension acceptance (Phase 2)
        run: npm --prefix packages/vscode-extension run acceptance:phase2

      - name: Security scan
        run: node packages/cli/dist/bin.js scan --fail-on dependency-policy --fail-on parse-error --fail-on secret-pattern

      - name: Upload Phase 2 acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-acceptance-reports
          path: |
            docs/dyknow/.state/phase2-acceptance-report.json
            docs/dyknow/.state/phase2-acceptance-report.md
          if-no-files-found: warn

      - name: Phase 3 demo-readiness docs check
        run: |
          test -f docs/handoff-phase3-demo.md
          rg -n "\[Phase 3 Public Demo Handoff\]\(handoff-phase3-demo\.md\)" docs/index.md
          rg -n "\| create \| docs/handoff-phase3-demo\.md \|" docs/log.md
          rg -n "^title: Phase 3 Public Demo Handoff$" docs/handoff-phase3-demo.md
          rg -n "^purpose:" docs/handoff-phase3-demo.md
          rg -n "^audience:" docs/handoff-phase3-demo.md
          rg -n "^sources:" docs/handoff-phase3-demo.md
